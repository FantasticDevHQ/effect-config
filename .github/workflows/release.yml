name: Release
# Publishes @fantastic.dev/effect-config to npm when a v<semver> tag is pushed.
# Verify and pack run on UbiCloud. Only Publish runs on a GitHub-hosted runner:
# an owner-approved exception (2026-11-18, FORG-155), because npm trusted
# publishing and provenance reject self-hosted runners. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  PACKAGE_NAME: "@fantastic.dev/effect-config"
  RELEASE_TAG: ${{ github.ref_name }}
jobs:
  verify:
    name: Verify release
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - name: Require a tag ref
        run: |
          echo "runner.name=$RUNNER_NAME"
          test "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" || { echo "Run this workflow from a v<semver> tag ref"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Tag matches package version
        run: node scripts/release/tag.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack once
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
          node scripts/release/pack-outputs.mjs "$RUNNER_TEMP/pack.json" | tee -a "$GITHUB_OUTPUT"
      - name: Install the tarball in a clean consumer
        run: node scripts/release/consumer.mjs "$RUNNER_TEMP"/release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: verify
    # Owner-approved exception: npm trusted publishing and provenance need a cloud-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
      PACKAGE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm trusted publishing support (npm 11.5.1+)
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release
      - name: Check the tarball is the one verified on UbiCloud
        run: |
          TARBALL=$(ls "$RUNNER_TEMP"/release/*.tgz)
          ACTUAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          test "$ACTUAL" = "$PACKAGE_INTEGRITY" || { echo "Integrity mismatch: $ACTUAL"; exit 1; }
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      # No install, build or lifecycle scripts run here. OIDC trusted publishing; no token.
      - name: Publish once with provenance
        run: |
          EXISTING=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$PACKAGE_INTEGRITY" || { echo "$PACKAGE_VERSION is already on npm with different contents"; exit 1; }
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with this integrity"
          else
            npm publish "$TARBALL" --provenance --access public --ignore-scripts
          fi
      - name: Verify the public version and provenance
        run: node scripts/release/published.mjs
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
