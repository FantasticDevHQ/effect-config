name: Release
# Publishes @fantastic.dev/effect-config to npm when a v<semver> tag is pushed.
# Verify runs on UbiCloud. Only Publish runs on a GitHub-hosted runner: an
# owner-approved exception (2026-11-18, FORG-155), because npm trusted
# publishing and provenance reject self-hosted runners. Publish builds the tag
# on that runner and publishes its own build, which must match the content
# verified on UbiCloud. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<semver> tag to verify and publish (recovery). Run from main.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  PACKAGE_NAME: "@fantastic.dev/effect-config"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  verify:
    name: Verify release
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - name: Resolve the release tag
        run: |
          echo "runner.name=$RUNNER_NAME"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" || { echo "Push a v<semver> tag"; exit 1; }
          fi
          echo "Releasing $RELEASE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Tag matches package version
        run: node scripts/release/tag.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack and record the content digest
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
          node scripts/release/pack-outputs.mjs "$RUNNER_TEMP/pack.json" | tee -a "$GITHUB_OUTPUT"
          echo "digest=$(node scripts/release/digest.mjs "$RUNNER_TEMP"/release/*.tgz)" | tee -a "$GITHUB_OUTPUT"
      - name: Install the tarball in a clean consumer
        run: node scripts/release/consumer.mjs "$RUNNER_TEMP"/release/*.tgz

  publish:
    name: Publish
    needs: verify
    # Owner-approved exception: npm trusted publishing and provenance need a cloud-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
      VERIFIED_DIGEST: ${{ needs.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm trusted publishing support (npm 11.5.1+)
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - name: Build the tag on this runner
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Pack and compare with the verified content
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/pack.json")
          TARBALL="$RUNNER_TEMP/release/$TARBALL"
          node scripts/release/digest.mjs "$TARBALL" > "$RUNNER_TEMP/digest.txt"
          node scripts/release/compare.mjs "$VERIFIED_DIGEST" "$(cat "$RUNNER_TEMP/digest.txt")"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "PACK_INTEGRITY=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].integrity)' "$RUNNER_TEMP/pack.json")" >> "$GITHUB_ENV"
      # OIDC trusted publishing; no token. No lifecycle scripts run during publish.
      - name: Publish once with provenance
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/registry"
            npm pack "$PACKAGE_NAME@$PACKAGE_VERSION" --pack-destination "$RUNNER_TEMP/registry" >/dev/null
            node scripts/release/compare.mjs "$VERIFIED_DIGEST" "$(node scripts/release/digest.mjs "$RUNNER_TEMP"/registry/*.tgz)" \
              || { echo "$PACKAGE_VERSION is already on npm with different contents"; exit 1; }
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with the verified contents; not publishing again"
          else
            npm publish "$TARBALL" --provenance --access public --ignore-scripts
            echo "PACKAGE_INTEGRITY=$PACK_INTEGRITY" >> "$GITHUB_ENV"
          fi
      - name: Verify the public version and provenance
        run: node scripts/release/published.mjs
      - name: Create the GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
